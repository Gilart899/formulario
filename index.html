<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --azul:#0057d8;
    --azul-escuro:#003b8e;
    --azul-claro:#1b7cff;
    --amarelo:#ffd21c;
    --verde:#25D366;
    --verde-escuro:#1ebe5d;
    --texto:#202938;
    --cinza:#667085;
    --borda:#e3e7ef;
    --fundo:#f5f8fd;
}

body{
    font-family:'Poppins',sans-serif;
    min-height:100vh;
    padding:25px;
    background:
        radial-gradient(circle at 10% 20%, rgba(255,255,255,.18), transparent 25%),
        radial-gradient(circle at 90% 80%, rgba(255,255,255,.15), transparent 25%),
        linear-gradient(135deg,#002f73,#0057d8,#2383ff);
    overflow-x:hidden;
}

/* =====================================================
   DECORAÇÃO DO FUNDO
===================================================== */

.decoracao{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:0;
}

.papel{
    position:absolute;
    width:120px;
    height:150px;
    background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.25);
    border-radius:8px;
    box-shadow:0 15px 35px rgba(0,0,0,.08);
    animation:flutuar 9s ease-in-out infinite;
}

.papel::before,
.papel::after{
    content:"";
    position:absolute;
    left:18px;
    right:18px;
    height:5px;
    border-radius:5px;
    background:rgba(255,255,255,.35);
}

.papel::before{
    top:35px;
    box-shadow:
        0 18px 0 rgba(255,255,255,.25),
        0 36px 0 rgba(255,255,255,.2);
}

.papel::after{
    top:105px;
    width:45%;
}

.papel1{
    top:8%;
    left:3%;
    transform:rotate(-18deg);
}

.papel2{
    top:65%;
    right:3%;
    transform:rotate(17deg);
    animation-delay:2s;
}

.papel3{
    top:35%;
    right:1%;
    width:90px;
    height:115px;
    transform:rotate(-12deg);
    animation-delay:4s;
}

.papel4{
    bottom:3%;
    left:5%;
    width:85px;
    height:110px;
    transform:rotate(12deg);
    animation-delay:6s;
}

.caneta{
    position:absolute;
    width:145px;
    height:14px;
    border-radius:20px;
    background:rgba(255,255,255,.24);
    box-shadow:0 8px 20px rgba(0,0,0,.1);
    animation:flutuarCaneta 11s ease-in-out infinite;
}

.caneta::before{
    content:"";
    position:absolute;
    right:-17px;
    top:2px;
    border-left:20px solid rgba(255,255,255,.3);
    border-top:5px solid transparent;
    border-bottom:5px solid transparent;
}

.caneta::after{
    content:"";
    position:absolute;
    left:20px;
    top:3px;
    width:35px;
    height:8px;
    border-radius:10px;
    background:rgba(255,255,255,.22);
}

.caneta1{
    top:22%;
    right:7%;
    transform:rotate(-35deg);
}

.caneta2{
    bottom:18%;
    left:2%;
    transform:rotate(30deg);
    animation-delay:3s;
}

@keyframes flutuar{
    0%,100%{
        margin-top:0;
    }
    50%{
        margin-top:-25px;
    }
}

@keyframes flutuarCaneta{
    0%,100%{
        transform:translateY(0) rotate(-35deg);
    }
    50%{
        transform:translateY(-25px) rotate(-25deg);
    }
}

/* =====================================================
   CONTAINER
===================================================== */

.container{
    position:relative;
    z-index:1;
    max-width:980px;
    margin:auto;
    background:#fff;
    border-radius:24px;
    overflow:hidden;
    box-shadow:0 25px 70px rgba(0,20,60,.35);
}

/* =====================================================
   TOPO
===================================================== */

.topo{
    position:relative;
    padding:40px 30px 35px;
    text-align:center;
    color:#fff;
    background:
        radial-gradient(circle at 15% 20%,rgba(255,255,255,.15),transparent 25%),
        linear-gradient(135deg,#003b8e,#0057d8,#1677ff);
}

.topo img{
    width:200px;
    max-width:80%;
    margin-bottom:18px;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,.3));
}

.topo h1{
    font-size:34px;
    font-weight:800;
    margin-bottom:8px;
}

.topo p{
    font-size:16px;
    opacity:.95;
}

.subtitulo{
    margin-top:8px;
    color:var(--amarelo);
    font-weight:700;
    font-size:15px;
}

.aviso{
    max-width:760px;
    margin:22px auto 0;
    padding:16px 20px;
    border-radius:14px;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.2);
    font-size:14px;
    line-height:1.6;
}

/* =====================================================
   FORMULÁRIO
===================================================== */

.formulario{
    padding:38px;
    background:#fff;
}

    margin-bottom:34px;
    padding-bottom:30px;
    border-bottom:1px solid #edf0f5;
}

    border-bottom:none;
